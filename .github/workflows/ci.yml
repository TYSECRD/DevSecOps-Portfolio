name: DevSecOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Security scan
        run: python -m bandit -r app

      - name: Dependency audit
        run: python -m pip_audit -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Build SteelDoor Docker image
        run: docker build -t steeldoor:ci .

      - name: Scan SteelDoor Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: steeldoor:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
